<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ACE Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; font-size: 16px; }
    input, button { font-size: 16px; padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; }
    #out { white-space: pre-wrap; background: #000; padding: 15px; border: 1px solid #0f0; min-height: 200px; }
    h2 { color: #fff; }
  </style>
</head>
<body>
  <h2>ACE Diagnostic Test</h2>

  <label>API Key:</label>
  <input id="key" placeholder="paste your sk-or-v1-... key here" />

  <label>Model:</label>
  <input id="model" value="openai/gpt-4o-mini" />

  <button onclick="go()">SEND TEST REQUEST</button>

  <h2>Result:</h2>
  <div id="out">Click the button above to test.</div>

<script>
function log(msg) {
  document.getElementById('out').textContent += "\n" + msg;
  console.log(msg);
}

function go() {
  var out = document.getElementById('out');
  out.textContent = "Starting test...";
  
  var key = document.getElementById('key').value.trim();
  var model = document.getElementById('model').value.trim();
  
  if (!key) { log("ERROR: no key entered"); return; }
  
  log("Key starts with: " + key.substring(0, 15) + "...");
  log("Model: " + model);
  log("Sending request to https://openrouter.ai/api/v1/chat/completions ...");
  log("Time: " + new Date().toLocaleTimeString());
  
  var controller = new AbortController();
  var timer = setTimeout(function() {
    controller.abort();
    log("!!! TIMED OUT after 20 seconds");
    log("!!! This means the network is BLOCKING openrouter.ai");
    log("!!! The request never reached the server.");
  }, 20000);
  
  fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + key
    },
    body: JSON.stringify({
      model: model,
      messages: [{ role: "user", content: "Say the word banana" }]
    }),
    signal: controller.signal
  })
  .then(function(res) {
    clearTimeout(timer);
    log("Got a response! HTTP " + res.status + " " + res.statusText);
    return res.text();
  })
  .then(function(body) {
    log("Response body:");
    log(body);
    log("=== TEST DONE ===");
  })
  .catch(function(err) {
    clearTimeout(timer);
    log("FETCH ERROR: " + err.name + " - " + err.message);
    log("=== TEST FAILED ===");
  });
}
</script>
</body>
</html>
